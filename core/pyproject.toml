[project]
name = "normly-core"
version = "0.1.0"
description = "Knowledge domain and repositories for document_index"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "sqlalchemy>=2,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.1,<4",
  "pgvector>=0.3,<0.4",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3,<4", "torch>=2", "torchvision>=0.15"]
builder = ["normly-core[retrieval]", "docling>=2.123,<3", "reportlab>=4,<5"]
exchange = ["pyarrow>=17,<20", "cryptography>=43,<46"]
dev = ["pytest>=8,<9", "testcontainers[postgres]>=4.15,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normly_core"]
