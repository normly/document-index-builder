name: Verify
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare PDF rendering libraries and metric-compatible fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation libgl1 libglib2.0-0 libgomp1
      - name: Install pinned tooling and locked test dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --all-packages --all-extras
      - name: Prepare pinned models before runtime tests
        run: uv run --no-sync python docker/prepare-models.py --kind all --output .local/models
      - name: Check reviewed HTTP contract
        run: uv run --no-sync python scripts/check-api-contract.py
      - name: Run synthetic tests with offline models
        env:
          HF_HUB_OFFLINE: "1"
          NORMLY_EMBEDDING_MODEL_PATH: ${{ github.workspace }}/.local/models/multilingual-e5-large
          NORMLY_DOCLING_ARTIFACTS_PATH: ${{ github.workspace }}/.local/models/docling
        run: uv run --no-sync pytest -q
      - name: Build code-only runtime images
        run: docker buildx bake -f docker-bake.hcl --load builder retrieval
      - name: Inspect built image boundaries
        env:
          RUN_IMAGE_TESTS: "1"
        run: uv run --no-sync pytest tests/test_image_boundaries.py -q
      - name: Rehearse synthetic builder and populated consumer lifecycle
        run: uv run --no-sync python tests/container_smoke.py
