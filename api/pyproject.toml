[project]
name = "normly-api"
version = "0.1.0"
description = "Stable document_index retrieval API"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["normly-core>=0.1,<0.2", "fastapi>=0.115,<0.120", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "pyyaml>=6,<7", "testcontainers[postgres]>=4.15,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normly_api"]
